<!-- Presa a modello la struttura che trovate sul libro a pag. 102 (quella dei libri con autore, edizione, ecc.), effettuare:
- creazione di una pagina HTML con una form per inserire nuovi libri
- al submit (invio della form) creare/modificare un file .json ben strutturato secondo le regole viste a lezione contenente una collezione di libri
(quindi ad ogni invio si aggiunge un libro alla biblioteca)
- visualizzare successivamente su una nuova pagina HTML il contenuto del JSON (la biblioteca) in formato tabellare

OPZIONALE:
- uso dei CSS (formattazione ad esempio del colore del carattere, del font, del peso, ecc.)
- controlli in javascript

NB: la lettura/scrittura del file .json va fatta in javascript e in locale -->

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Inserimento dei libri</title>

    <!-- Icona del sito (favicon.ico) -->
    <link rel="icon" href="images/favicon.ico">

    <!-- File CSS -->
    <link rel="stylesheet" href="Pontellini_001.css">
</head>

<body>

    <!-- Banner superiore -->
    <img class="banner" src="images/Biblioteca.png" alt="Biblioteca">

    <div class="container">

        <h1>Biblioteca</h1>

        <!-- FORM per inserire un nuovo libro -->
        <form class="form" id="formLibro" method="POST">

            <!-- Campi del libro -->
            <input type="text" id="categoria" placeholder="Numero di categoria" required>
            <input type="text" id="numero" placeholder="Numero del libro" required>
            <input type="text" id="titolo" placeholder="Titolo" required>
            <input type="text" id="autore" placeholder="Autore" required>
            <input type="text" id="edizione" placeholder="Edizione" required>

            <!-- Caricamento di un file JSON esistente -->
            <div class="file-wrapper">
                <label>Carica il file JSON:</label>
                <input type="file" id="fileJSON" accept=".json">
            </div>

            <!-- Pulsante per aggiungere il libro -->
            <input type="submit" value="Aggiungi il libro"/>

            <!-- Pulsante per scaricare il JSON aggiornato -->
            <button id="scaricaJSON" type="button">Scarica il JSON</button>

            <!-- Pulsante per andare alla pagina di visualizzazione -->
            <a href="Pontellini_001_b.html">
                <button type="button" style="margin-top: 20px; width: 100%;">Vai alla tabella</button>
            </a>
        </form>
    </div>

<script>
// Oggetto principale della biblioteca
let biblioteca = { libri: [] };

// Caricamento di un file JSON
document.getElementById("fileJSON").addEventListener("change", e => {

    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = () => {
        biblioteca = JSON.parse(reader.result); // Converte il JSON in oggetto JS
        aggiornaTabella(); // Aggiorna la tabella
    };

    reader.readAsText(file);
});

// Aggiunta del libro dalla FORM
document.getElementById("formLibro").addEventListener("submit", e => {
    e.preventDefault(); // Evita il refresh

    // Crea l’oggetto libro
    const libro = {
        categoria: categoria.value,
        numero: numero.value,
        titolo: titolo.value,
        autore: autore.value,
        edizione: edizione.value
    };

    // Aggiunge il libro alla collezione
    biblioteca.libri.push(libro);

    // Aggiorna la tabella
    aggiornaTabella();

    // Reset del form
    e.target.reset();
});

// Aggiorna la tabella HTML
function aggiornaTabella() {
    const tbody = document.querySelector("#tabellaLibri tbody");

    tbody.innerHTML = biblioteca.libri.map(l => `
        <tr>
            <td>${l.categoria}</td>
            <td>${l.numero}</td>
            <td>${l.titolo}</td>
            <td>${l.autore}</td>
            <td>${l.edizione}</td>
        </tr>
    `).join("");
}

// Scaricamento del JSON
document.getElementById("scaricaJSON").addEventListener("click", () => {

    const dati = JSON.stringify(biblioteca, null, 2);
    const blob = new Blob([dati], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "biblioteca.json";
    link.click();

    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
